# 零碳微证 · 前端自动部署到 GitHub Pages
# 触发：main 分支 frontend/** 变更 或 手动触发(workflow_dispatch)
# 产物：https://<用户名>.github.io/zero-carbon-chain/
# 首次启用：仓库 Settings → Pages → Build and deployment → Source 选择 "GitHub Actions"
name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 不用 npm ci：其配合 npm 缓存时存在跳过 esbuild/rollup 平台二进制的已知问题，
      # npm install 与本地验证成功的安装路径保持一致
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      # GITHUB_PAGES_REPO 决定 vite base（/zero-carbon-chain/），合约地址已固化在 public/contracts.json
      # 构建失败时把日志尾部写入 step summary（check-run API 可匿名读取，便于远程诊断）
      - name: Build
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log || {
            echo "### vite build 失败日志（尾部 40 行）" >> "$GITHUB_STEP_SUMMARY"
            tail -40 /tmp/build.log >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
        env:
          GITHUB_PAGES_REPO: zero-carbon-chain

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
