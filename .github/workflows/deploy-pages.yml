# 零碳微证 · 前端构建发布到 GitHub Pages
# 说明：CI 构建存在 esbuild/rollup 平台二进制兼容问题待排查，当前采用本地构建 + 推送 gh-pages 分支发布；
#       本 workflow 保留为手动触发，待 CI 环境修复后可恢复 push 自动构建。
# 首次启用：仓库 Settings → Pages → Source 选 "GitHub Actions" 后手动 Run workflow
name: Deploy Frontend to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 不用 npm ci：其配合 npm 缓存时存在跳过 esbuild/rollup 平台二进制的已知问题，
      # npm install 与本地验证成功的安装路径保持一致
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      # GITHUB_PAGES_REPO 决定 vite base（/zero-carbon-chain/），合约地址已固化在 public/contracts.json
      # 构建失败时日志尾部写入 step summary 并上传 paste.rs（匿名可读，便于远程诊断）
      - name: Build
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          if npm run build 2>&1 | tee /tmp/build.log; then
            echo "✓ vite build 成功"
          else
            echo "### vite build 失败日志（尾部 50 行）" >> "$GITHUB_STEP_SUMMARY" || true
            tail -50 /tmp/build.log >> "$GITHUB_STEP_SUMMARY" || true
            URL=$(tail -120 /tmp/build.log | curl -sS --max-time 20 --data-binary @- https://paste.rs) || true
            echo "完整日志快照: $URL" >> "$GITHUB_STEP_SUMMARY" || true
            exit 1
          fi
        env:
          GITHUB_PAGES_REPO: zero-carbon-chain

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
